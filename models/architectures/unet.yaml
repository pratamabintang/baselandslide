# U-Net Architecture Configuration for Landslide Segmentation

nc: 1  # Number of segmentation classes (1 for binary landslide mask)
depth_multiple: 1.0
width_multiple: 1.0

# Backbone (Encoder & Bottleneck)
backbone:
  # [from, number, module, args]
  # Layer 0: Multi-modal 1x1 Conv input projection (maps arbitrary C_in -> 3)
  [[-1, 1, Conv, [3, 1, 1]],         # 0 - Input projection to 3 channels (1x1 Conv)
   [-1, 1, DoubleConv, [64]],        # 1 - Encoder Stage 1 (3 -> 64)
   [-1, 1, Down, [128]],             # 2 - Encoder Stage 2 (64 -> 128, stride 2)
   [-1, 1, Down, [256]],             # 3 - Encoder Stage 3 (128 -> 256, stride 4)
   [-1, 1, Down, [512]],             # 4 - Encoder Stage 4 (256 -> 512, stride 8)
   [-1, 1, Down, [1024]],            # 5 - Bottleneck (512 -> 1024, stride 16)
  ]

# Head (Decoder & Output Layer)
head:
  # [from, number, module, args]
  [[[5, 4], 1, Up, [512]],           # 6 - Decoder Stage 4 (up 5 + skip 4 -> 512)
   [[6, 3], 1, Up, [256]],           # 7 - Decoder Stage 3 (up 6 + skip 3 -> 256)
   [[7, 2], 1, Up, [128]],           # 8 - Decoder Stage 2 (up 7 + skip 2 -> 128)
   [[8, 1], 1, Up, [64]],            # 9 - Decoder Stage 1 (up 8 + skip 1 -> 64)
   [-1, 1, OutConv, [1]],            # 10 - Output 1x1 Conv (64 -> nc)
  ]
