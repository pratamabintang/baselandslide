# Lightweight U-Net Architecture Configuration for Fast Training/Inference

nc: 2  # Number of segmentation classes (2 for background + landslide mask)
depth_multiple: 1.0
width_multiple: 1.0

# Backbone (Encoder & Bottleneck)
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [3, 1, 1]],         # 0 - Input projection to 3 channels (1x1 Conv)
   [-1, 1, DoubleConv, [32]],        # 1 - Encoder Stage 1 (3 -> 32)
   [-1, 1, Down, [64]],              # 2 - Encoder Stage 2 (32 -> 64, stride 2)
   [-1, 1, Down, [128]],             # 3 - Encoder Stage 3 (64 -> 128, stride 4)
   [-1, 1, Down, [256]],             # 4 - Encoder Stage 4 (128 -> 256, stride 8)
   [-1, 1, Down, [512]],             # 5 - Bottleneck (256 -> 512, stride 16)
  ]

# Head (Decoder & Output Layer)
head:
  # [from, number, module, args]
  [[[5, 4], 1, Up, [256]],           # 6 - Decoder Stage 4 (up 5 + skip 4 -> 256)
   [[6, 3], 1, Up, [128]],           # 7 - Decoder Stage 3 (up 6 + skip 3 -> 128)
   [[7, 2], 1, Up, [64]],            # 8 - Decoder Stage 2 (up 7 + skip 2 -> 64)
   [[8, 1], 1, Up, [32]],            # 9 - Decoder Stage 1 (up 8 + skip 1 -> 32)
   [-1, 1, OutConv, [2]],            # 10 - Output 1x1 Conv (32 -> nc)
  ]
