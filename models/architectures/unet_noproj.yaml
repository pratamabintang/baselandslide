# Direct U-Net Architecture (No Input Projection Layer)
# Designed for Pure 3-Channel RGB or Element-wise Additive Multi-modal Fusion (RGB + DTM)

nc: 2  # Number of segmentation classes (2 for background + landslide mask)
depth_multiple: 1.0
width_multiple: 1.0

# Backbone (Encoder & Bottleneck)
backbone:
  # [from, number, module, args]
  [[-1, 1, DoubleConv, [64]],        # 0 - Encoder Stage 1 (in_channels -> 64)
   [-1, 1, Down, [128]],             # 1 - Encoder Stage 2 (64 -> 128, stride 2)
   [-1, 1, Down, [256]],             # 2 - Encoder Stage 3 (128 -> 256, stride 4)
   [-1, 1, Down, [512]],             # 3 - Encoder Stage 4 (256 -> 512, stride 8)
   [-1, 1, Down, [1024]],            # 4 - Bottleneck (512 -> 1024, stride 16)
  ]

# Head (Decoder & Output Layer)
head:
  # [from, number, module, args]
  [[[4, 3], 1, Up, [512]],           # 5 - Decoder Stage 4 (up 4 + skip 3 -> 512)
   [[5, 2], 1, Up, [256]],           # 6 - Decoder Stage 3 (up 5 + skip 2 -> 256)
   [[6, 1], 1, Up, [128]],           # 7 - Decoder Stage 2 (up 6 + skip 1 -> 128)
   [[7, 0], 1, Up, [64]],            # 8 - Decoder Stage 1 (up 7 + skip 0 -> 64)
   [-1, 1, OutConv, [nc]],           # 9 - Output 1x1 Conv (64 -> nc)
  ]
