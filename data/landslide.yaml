# Landslide Multi-Modal Dataset Configuration

# Dataset directory paths (relative to repo root or absolute)
path: dataset/dataset_1
train: train
val: validation

# Classes
nc: 2
names: ['background', 'landslide']

# Active input modalities preset or list
# Available modalities: IMAGE (3ch), DTM_NORM (1ch), SLOPE (1ch), ASPECT (2ch: sin/cos)
# Fusion modes:
# Fusion modes:
#   - concat (default / recommended): Stacks modalities into C_in channels (e.g. RGB + DTM = 4 channels, RGB + Topo = 7 channels). Preserves modality identity.
#   - add: Element-wise addition of 1-channel scalar rasters into 3 RGB channels (e.g. (RGB + DTM)/2 in [0, 1]).
default_input: rgb_only

presets:
  rgb_only: ['IMAGE']                                # 3 channels (Pure RGB)
  topo_only: ['DTM_NORM', 'SLOPE', 'ASPECT']         # 4 channels (1 DTM + 1 SLOPE + 2 ASPECT)
  rgb_dtm: ['IMAGE', 'DTM_NORM']                     # 4 channels (concat) or 3 channels (add)
  rgb_slope: ['IMAGE', 'SLOPE']                      # 4 channels (concat) or 3 channels (add)
  rgb_aspect: ['IMAGE', 'ASPECT']                    # 5 channels (concat only; ASPECT has 2 channels)
  all: ['IMAGE', 'DTM_NORM', 'SLOPE', 'ASPECT']      # 7 channels (concat only)
  rgb_add_dtm: ['IMAGE', 'DTM_NORM']                 # Preset for (RGB + DTM)/2 addition fusion
  rgb_add_slope: ['IMAGE', 'SLOPE']                  # Preset for (RGB + SLOPE)/2 addition fusion

# Modality metadata and normalization parameters
modality_info:
  IMAGE:
    folder: IMAGE
    ext: .png
    channels: 3
    norm_type: scale
    scale_factor: 255.0
  DTM_NORM:
    folder: DTM_NORM
    ext: .tif
    channels: 1
    norm_type: scale
    scale_factor: 65535.0
  SLOPE:
    folder: SLOPE
    ext: .tif
    channels: 1
    norm_type: degrees_90
    scale_factor: 90.0
  ASPECT:
    folder: ASPECT
    ext: .tif
    channels: 2
    norm_type: sincos
  LABEL:
    folder: LABEL
    ext: .png
    channels: 1
    norm_type: binary_mask
    positive_val: 65535
