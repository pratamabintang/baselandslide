# Landslide Multi-Modal Dataset Configuration

# Dataset directory paths (relative to repo root or absolute)
path: dataset/dataset_1
train: train
val: validation

# Classes
nc: 2
names: ['background', 'landslide']

# Active input modalities preset or list
# Available modalities: IMAGE (3ch), DTM_NORM (1ch), SLOPE (1ch), ASPECT (2ch: sin/cos)
# Fusion modes:
#   - concat (default): Stacks modalities into C_in channels (e.g. RGB + DTM = 4 channels)
#   - add: Element-wise addition into 3 RGB channels (e.g. normalized RGB + normalized DTM = 3 channels)
default_input: rgb_only

presets:
  rgb_only: ['IMAGE']                                # 3 channels (Pure RGB)
  topo_only: ['DTM_NORM', 'SLOPE', 'ASPECT']         # 4 channels (1 DTM + 1 SLOPE + 2 ASPECT)
  rgb_dtm: ['IMAGE', 'DTM_NORM']                     # 4 channels (concat) or 3 channels (add)
  rgb_slope: ['IMAGE', 'SLOPE']                      # 4 channels (concat) or 3 channels (add)
  rgb_aspect: ['IMAGE', 'ASPECT']                    # 5 channels (concat) or 3 channels (add)
  all: ['IMAGE', 'DTM_NORM', 'SLOPE', 'ASPECT']      # 7 channels (concat) or 3 channels (add)
  rgb_add_dtm: ['IMAGE', 'DTM_NORM']                 # Preset for RGB + DTM addition fusion
  rgb_add_slope: ['IMAGE', 'SLOPE']                  # Preset for RGB + SLOPE addition fusion
  rgb_add_aspect: ['IMAGE', 'ASPECT']                # Preset for RGB + ASPECT addition fusion

# Modality metadata and normalization parameters
modality_info:
  IMAGE:
    folder: IMAGE
    ext: .png
    channels: 3
    norm_type: scale
    scale_factor: 255.0
  DTM_NORM:
    folder: DTM_NORM
    ext: .tif
    channels: 1
    norm_type: scale
    scale_factor: 65535.0
  SLOPE:
    folder: SLOPE
    ext: .tif
    channels: 1
    norm_type: degrees_90
    scale_factor: 90.0
  ASPECT:
    folder: ASPECT
    ext: .tif
    channels: 2
    norm_type: sincos
  LABEL:
    folder: LABEL
    ext: .png
    channels: 1
    norm_type: binary_mask
    positive_val: 65535
