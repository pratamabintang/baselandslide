# ==============================================================================
# Full 7-Channel Multi-Modal Training Configuration (RGB + DTM + Slope + Aspect)
# ==============================================================================
# Usage:
#   python train.py --config configs/train_multimodal.yaml
# ==============================================================================

cfg: models/architectures/unet.yaml
data: data/landslide.yaml
hyp: data/hyp.scratch.yaml
inputs: all                       # Full 7 channels: IMAGE(3) + DTM_NORM(1) + SLOPE(1) + ASPECT(2)
weights: ''
