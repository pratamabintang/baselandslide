epochs: 50
batch_size: 12
img_size: 512
conf_thres: 0.5

device: '0'
workers: 2
cache_ram: true
accumulate: 1
deterministic: false

project: runs/train
name: exp_multimodal_all
exist_ok: false
patience: 15
seed: 42
